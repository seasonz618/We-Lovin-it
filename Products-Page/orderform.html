<main class="main">
    
<div class="header">
    <h1>Order Now</h1>
</div>

<form action="ordersubmit.html" method="get" class="form">
    <fieldset class="details">
        <div>
            <label for="custname">Name</label>
            <input type="text" id="custname" name="custname" placeholder="Jane Doe" required>
        </div>

        <div>
            <label for="custemail">Email</label>
            <input type="email" id="custemail" name="custemail" placeholder="janedoe@example.com" required>
        </div>
    </fieldset>

    <fieldset class="notes">
        <label for="orderNotes">Order Notes</label>
        <textarea id="orderNotes" name="orderNotes" placeholder="Add any special requests or delivery notes here"></textarea>
    </fieldset>

    <fieldset class="food">
        <h2>Menu</h2>

        <div class="setmeals">
            <h3>Set Meals</h3>
            <label for="setmeal1">Cheeseburger Happy Meal</label>
            <input type="radio" id="setmeal1" name="setmeal" value="Cheeseburger Happy Meal">

            <label for="setmeal2">Chicken McNuggets Happy Meal</label>
            <input type="radio" id="setmeal2" name="setmeal" value="Chicken McNuggets Happy Meal">

            <label for="setmeal3">Family Sharing Meal</label>
            <input type="radio" id="setmeal3" name="setmeal" value="Family Sharing Meal">
        </div>

        <div class="burger">
            <h3>Burgers</h3>
            <label for="main1">Quarter Pounder w/ Cheese</label>
            <input type="radio" id="main1" name="main" value="Quarter Pounder w/ Cheese">

            <label for="main2">Cheeseburger</label>
            <input type="radio" id="main2" name="main" value="Cheeseburger">

            <label for="main3">McSpicy</label>
            <input type="radio" id="main3" name="main" value="McSpicy">

            <label for="main4">Filet-O-Fish</label>
            <input type="radio" id="main4" name="main" value="Filet-O-Fish">

            <label for="main5">McChicken</label>
            <input type="radio" id="main5" name="main" value="McChicken">

            <label for="main6">Buttermilk Crispy Chicken</label>
            <input type="radio" id="main6" name="main" value="Buttermilk Crispy Chicken">

            <label for="main7">Big Mac</label>
            <input type="radio" id="main7" name="main" value="Big Mac">
        </div>

        <div class="sides">
            <h3>Sides</h3>
            <label for="side1">Chicken McCrispy (2pc)</label>
            <input type="radio" id="side1" name="side" value="Chicken McCrispy">

            <label for="side2">Chicken McNuggets (6pc)</label>
            <input type="radio" id="side2" name="side" value="Chicken McNuggets">

            <label for="side3">Garden Side Salad</label>
            <input type="radio" id="side3" name="side" value="Garden Side Salad">

            <label for="side4">Happy Sharing Box</label>
            <input type="radio" id="side4" name="side" value="Happy Sharing Box">

            <label for="side5">French Fries</label>
            <input type="radio" id="side5" name="side" value="French Fries">

            <label for="side6">Apple Pie</label>
            <input type="radio" id="side6" name="side" value="Apple Pie">

            <label for="side7">Chocolate Ice Cream</label>
            <input type="radio" id="side7" name="side" value="Chocolate Ice Cream">
        </div>

        <div class="drinks">
            <h3>Drinks</h3>
            <label for="drinks1">Coca Cola Original</label>
            <input type="radio" id="drinks1" name="drinks" value="Coca Cola Original">

            <label for="drinks2">Ice Mountain Drinking Water</label>
            <input type="radio" id="drinks2" name="drinks" value="Ice Mountain Drinking Water">
        </div>
    </fieldset>

    <button type="submit">Submit</button>
</form>
</main>
