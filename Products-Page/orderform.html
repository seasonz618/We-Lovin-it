<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Now</title>
    <link rel="stylesheet" href="../CSS-files/products.css">
	<link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>

<body class="body">

<nav class="nav">
	<ul>
		<li>
			<a href="../index.html">
				<img src="../Images/mcdonald.webp" alt="McDonalds logo">
			</a>
		</li>
		<li>
			<a class="txthyplnks" href="products.html">Menu</a>
		</li>
		<li>
			<a class="txthyplnks" href="../Form-Pages/form.html">Forms</a>
		</li>
		<li>
			<a class="txthyplnks" href="../Contacts-Us-Pages/contactus.html">Contacts</a>
		</li>
	</ul>
</nav>

<main class="main">
    
<div class="header">
    <h1>Order Now</h1>
</div>

<form action="ordersubmit.html" method="get" class="form">
    <fieldset class="details">
        <div>
            <label for="custname">Name</label>
            <input type="text" id="custname" name="custname" placeholder="Jane Doe" required>
        </div>

        <div>
            <label for="custemail">Email</label>
            <input type="email" id="custemail" name="custemail" placeholder="janedoe@example.com" required>
        </div>
    </fieldset>

    <fieldset class="food">
        <h2>Menu</h2>

        <div class="setmeals">
            <h3>Set Meals</h3>
            <label for="setmeal">Cheeseburger Happy Meal</label>
            <input type="radio" id="setmeal" name="setmeal" value="Cheeseburger Happy Meal">

            <label for="setmeal">Chicken McNuggets Happy Meal</label>
            <input type="radio" id="setmeal" name="setmeal" value="Chicken McNuggets Happy Meal">

            <label for="setmeal">Family Sharing Meal</label>
            <input type="radio" id="setmeal" name="setmeal" value="Family Sharing Meal">
        </div>

        <div class="burger">
            <h3>Burgers</h3>
            <label for="main">Quarter Pounder w/ Cheese</label>
            <input type="radio" id="main" name="main" value="Quarter Pounder w/ Cheese">

            <label for="main">Cheeseburger</label>
            <input type="radio" id="main" name="main" value="Cheeseburger">

            <label for="main">McSpicy</label>
            <input type="radio" id="main" name="main" value="McSpicy">

            <label for="main">Filet-O-Fish</label>
            <input type="radio" id="main" name="main" value="Filet-O-Fish">

            <label for="main">McChicken</label>
            <input type="radio" id="main" name="main" value="McChicken">

            <label for="main">Buttermilk Crispy Chicken</label>
            <input type="radio" id="main" name="main" value="Buttermilk Crispy Chicken">

            <label for="main">Big Mac</label>
            <input type="radio" id="main" name="main" value="Big Mac">
        </div>

        <div class="sides">
            <h3>Sides</h3>
            <label for="side">Chicken McCrispy (2pc)</label>
            <input type="radio" id="side" name="side" value="Chicken McCrispy">

            <label for="side">Chicken McNuggets (6pc)</label>
            <input type="radio" id="side" name="side" value="Chicken McNuggets">

            <label for="side">Garden Side Salad</label>
            <input type="radio" id="side" name="side" value="Garden Side Salad">

            <label for="side">Happy Sharing Box</label>
            <input type="radio" id="side" name="side" value="Happy Sharing Box">

            <label for="side">French Fries</label>
            <input type="radio" id="side" name="side" value="French Fries">

            <label for="side">Apple Pie</label>
            <input type="radio" id="side" name="side" value="Apple Pie">

            <label for="side">Chocolate Ice Cream</label>
            <input type="radio" id="side" name="side" value="Chocolate Ice Cream">
        </div>

        <div class="drinks">
            <h3>Drinks</h3>
            <label for="drinks">Coca Cola Original</label>
            <input type="radio" id="drinks" name="drinks" value="Coca Cola Original">

            <label for="drinks">Ice Mountain Drinking Water</label>
            <input type="radio" id="drinks" name="drinks" value="Ice Mountain Drinking Water">
        </div>
    </fieldset>

    <button type="submit">Submit</button>
</form>
</main>

</body>
</html>
