<main class="main">
    
<div class="header">
    <h1>Order Now</h1>
</div>

<form action="ordersubmit.html" method="get" class="form">
    <fieldset class="details">
        <div>
            <label for="custname">Name</label>
            <input type="text" id="custname" name="custname" placeholder="Jane Doe" required>
        </div>

        <div>
            <label for="custemail">Email</label>
            <input type="email" id="custemail" name="custemail" placeholder="janedoe@example.com" required>
        </div>
    </fieldset>

    <fieldset class="food">
        <h2>Menu</h2>

        <div class="burger">
            <h3>Mains</h3>
            <label for="main">Cheeseburger</label>
            <input type="radio" id="main" name="main" value="Cheeseburger">
            
            <label for="main">Fried Chicken</label>
            <input type="radio" id="main" name="main" value="Fried Chicken">

            <label for="main">Happy Meal</label>
            <input type="radio" id="main" name="main" value="Happy Meal">
        </div>

        <div class="side">
            <h3>Sides</h3>
            <label for="side">Fries</label>
            <input type="radio" id="side" name="side" value="Fries">

            <label for="side">Soft Serve</label>
            <input type="radio" id="side" name="side" value="Soft Serve">

            <label for="side">Apple Pie</label>
            <input type="radio" id="side" name="side" value="Apple Pie">
            
        </div>

        <div class="le_thirst_quenchers">
            <h3>Drinks</h3>
            <label for="drinks">Soda</label>
            <input type="radio" id="drinks" name="drinks" value="Soda">
        </div>
    </fieldset>

    <button type="submit">Submit</button>
</form>
</main>

</body>
</html>
