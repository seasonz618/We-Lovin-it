<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="../CSS-files/products.css">
	<link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>

<body class="body">

<nav class="nav">
	<ul>
		<li>
			<a href="../index.html">
				<img src="../Images/mcdonald.webp" alt="mcdonalds_logo" href="../index.html">
			</a>
		</li>
		<li>
			<a class="txthyplnks" href="products.html">Menu</a>
		</li>
		<li>
			<a class="txthyplnks" href="../Form-Pages/form.html">Forms</a>
		</li>
		<li>
			<a class="txthyplnks" href="../Contacts-Us-Pages/contactus.html">Contacts</a>
		</li>
	</ul>
</nav>

<main class="main">
    <h1 style="margin-top: 4rem; text-align: center;">Thank you for your order!</h1>
    <p id="redirect-msg" style="text-align: center; margin-top: 1rem;">
        You will be redirected back to the order page in <span id="countdown">10</span> seconds. 
        <a href="orderform.html">Click here</a> if not redirected.</p>
    <div id="order-summary" style="max-width: 720px; margin: auto; padding: 1rem; text-align: center;"></div>
    <img src="lmao.jpg" alt="css" style="display: block; margin: 2rem auto; max-width: 400px; height: auto;">
</main>

<script>
(() => {
	const params = new URLSearchParams(window.location.search);
	const name = params.get('custname') || '';
	const email = params.get('custemail') || '';
	const notes = params.get('orderNotes') || '';
	const burgers = params.getAll('burgers');
	const qty1 = parseInt(params.get('qtyBurger1') || '0', 10);
	const qty2 = parseInt(params.get('qtyBurger2') || '0', 10);
	const qty3 = parseInt(params.get('qtyBurger3') || '0', 10);

	const heading = document.querySelector('h1');
	if (name) {
		heading.textContent = `Thank you for your order, ${name}!`;
	}

	const container = document.getElementById('order-summary');
	if (!params.toString()) {
		container.innerHTML = '<p><em>What did you expect to see here?</em></p>';
		return;
	}

	const parts = [];
	if (email) parts.push(`<p><strong>Email:</strong> ${email}</p>`);

	const items = [];
	if (burgers.includes('Burger 1') && qty1 > 0) items.push({ name: 'Burger 1', qty: qty1 });
	if (burgers.includes('Burger 2') && qty2 > 0) items.push({ name: 'Burger 2', qty: qty2 });
	if (burgers.includes('Burger 3') && qty3 > 0) items.push({ name: 'Burger 3', qty: qty3 });

	if (items.length) {
		let list = '<h2>Order Summary</h2><ul>';
		items.forEach(it => { list += `<li>${it.name} — Qty: ${it.qty}</li>`; });
		list += '</ul>';
		parts.push(list);
	} else {
		parts.push('<p><em>No items selected.</em></p>');
	}

	if (notes) parts.push(`<p><strong>Notes:</strong> ${notes}</p>`);
	container.innerHTML = parts.join('\n');

	const countdownEl = document.getElementById('countdown');
	let seconds = 10;
	const intervalId = setInterval(() => {
		seconds -= 1;
		if (seconds <= 0) {
			clearInterval(intervalId);
			window.location.href = 'orderform.html';
			return;
		}
		countdownEl.textContent = seconds;
	}, 1000);
})();
</script>

</body>
</html>
