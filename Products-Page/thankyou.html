<h1 style="margin-top: 10rem; text-align: center;">Thank you for your order!</h1>
<p id="redirect-msg" style="text-align: center; margin-top: 1rem;">Thank you for your order! You will be redirected to the menu in 67 seconds. <a href="products.html">Click here</a> if not redirected.</p>

<div id="order-summary" style="max-width:720px;margin:2rem auto;padding:1rem;text-align:left;"></div>

<script>
	
//idk what this is but it works so i guess its good enough

(() => {
	const params = new URLSearchParams(window.location.search);
	const name = params.get('custname');
	const email = params.get('custemail');
	const notes = params.get('orderNotes') || '';
	const burgers = params.getAll('burgers');
	const qty1 = parseInt(params.get('qtyBurger1') || '0', 10) || 0;
	const qty2 = parseInt(params.get('qtyBurger2') || '0', 10) || 0;
	const qty3 = parseInt(params.get('qtyBurger3') || '0', 10) || 0;

	const h = document.querySelector('h1');
	if (name) h.textContent = `Thank you for your order, ${decodeURIComponent(name)}!`;

	const container = document.getElementById('order-summary');
	if (!params.toString()) {
		container.innerHTML = '<p><em>No order data found — submit the order form to see a summary here.</em></p>';
		return;
	}

	const parts = [];
	if (email) parts.push(`<p><strong>Email:</strong> ${decodeURIComponent(email)}</p>`);

	const items = [];
	if (burgers.includes('Burger 1') && qty1 > 0) items.push({name: 'Burger 1', qty: qty1});
	if (burgers.includes('Burger 2') && qty2 > 0) items.push({name: 'Burger 2', qty: qty2});
	if (burgers.includes('Burger 3') && qty3 > 0) items.push({name: 'Burger 3', qty: qty3});

	if (items.length) {
		let list = '<h2>Order Summary</h2><ul>';
		items.forEach(it => { list += `<li>${it.name} — Qty: ${it.qty}</li>`; });
		list += '</ul>';
		parts.push(list);
	} else {
		parts.push('<p><em>No items selected.</em></p>');
	}

	if (notes) parts.push(`<p><strong>Notes:</strong> ${decodeURIComponent(notes)}</p>`);

	container.innerHTML = parts.join('\n');
})();
</script>
